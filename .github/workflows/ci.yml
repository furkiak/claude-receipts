name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo

  # The A/B tasks need pytest and the .NET SDK. --check proves each task is fair; replay proves this version raises
  # no false alarm on the stored sessions. Upstream tasks are skipped here: they need a local clone (eval/tasks-oss).
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: node eval/ab.js --check
      - run: node eval/replay.js
